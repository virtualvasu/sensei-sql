# Shared QLoRA settings; variant configs (human/teacher/combined) override fields.
seed: 0
base_model: student            # key in configs/models.yaml
teacher_pairs: data/distill/teacher_pairs.jsonl
data: []                       # any of: human, teacher
teacher_fraction: 1.0          # keep this share of teacher pairs (dataset-size ablation, #6)
val_fraction: 0.02             # held-out pairs from the training data (train DBs only)
max_length: 4096               # longer examples are dropped, not truncated (would cut the SQL)

quantization:                  # bitsandbytes 4-bit NF4, double quant, bf16 compute
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear

training:
  num_train_epochs: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03             # float < 1 = fraction of total steps
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 8
  weight_decay: 0.0
  logging_steps: 20
  eval_steps: 200
  save_steps: 400
  save_total_limit: 3
  gradient_checkpointing: true
  # batch examples of similar length: prompts range ~300-4096 tokens, so random batches
  # waste most compute on padding
  train_sampling_strategy: group_by_length

sanity_check:                  # quick dev accuracy after training via the eval harness (#3)
  limit: 200
