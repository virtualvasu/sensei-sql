<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Offline natural-language-to-SQL with a distilled 1.5B model." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sensei-sql</title>
    <script>
      // apply the saved/system theme before first paint (no light flash in dark mode)
      try {
        var t = localStorage.getItem('sensei-theme') || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
