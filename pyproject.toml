[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei-sql"
version = "0.1.0"
description = "Distilling a Qwen3.5-9B text-to-SQL teacher into an offline Qwen2.5-Coder-1.5B student"
readme = "README.md"
# The GPU box ships Python 3.10 and an NVIDIA 570 driver (CUDA <= 12.8); see the gpu extra.
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=27",
    "pyyaml>=6",
    "tqdm>=4.66",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Pinned to the newest CUDA 12.8 stack: torch 2.10.0 (cu128) and the vllm release built on it.
gpu = [
    "vllm==0.19.1",
    "torch==2.10.0",
    "transformers>=5",
    "peft>=0.17",
    "bitsandbytes>=0.46",
    "trl>=1.0,<1.15",
    "accelerate>=1.0",
    "datasets>=3.0",
]
app = [
    "gradio>=5",
    "openai>=1.50",
]
download = [
    "huggingface_hub>=0.34",
    "gdown>=5",
]
dev = [
    "pytest>=8",
    # required by third_party/test-suite-sql-eval (scoring in #3)
    "nltk",
    "sqlparse",
    # training curves (#5) and results plots (#6)
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
